<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Zynko{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% include 'navbar.html' %}
  <div class="container mt-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{cat}}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}

  <script>
    // Force unregister any old service workers and clear caches so clients fetch latest assets
    (function(){
      if ('serviceWorker' in navigator) {
        try{
          navigator.serviceWorker.getRegistrations().then(function(regs){
            regs.forEach(function(r){ r.unregister(); });
          }).catch(function(){});
        }catch(e){}
      }
      if (window.caches) {
        try{
          caches.keys().then(function(keys){ keys.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
        }catch(e){}
      }
    })();

    // Replace visible escaped "\\n" sequences in text nodes with line breaks (<br>)
    (function replaceEscapedNewlines(){
      function shouldSkip(node){
        var p = node.parentElement; if(!p) return true;
        var skip = ['SCRIPT','STYLE','TEXTAREA','PRE','CODE','INPUT','OPTION','SELECT'];
        return skip.indexOf(p.tagName) !== -1;
      }
      try{
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        var nodes = [];
        while(walker.nextNode()){
          var n = walker.currentNode;
          if(shouldSkip(n)) continue;
          if(n.nodeValue && n.nodeValue.indexOf('\\n') !== -1){ nodes.push(n); }
        }
        nodes.forEach(function(n){
          var parent = n.parentElement;
          var parts = n.nodeValue.split('\\n').map(function(s){ return s.replace(/</g,'&lt;').replace(/>/g,'&gt;'); });
          var span = document.createElement('span');
          span.innerHTML = parts.join('<br>');
          parent.replaceChild(span, n);
        });
      }catch(e){ console.warn('replaceEscapedNewlines failed', e); }
    })();

    // Sanitize anchor hrefs and intercept clicks for broken links containing quotes or %22
    (function sanitizeAnchors(){
      function cleanHref(h){
        if(!h) return h;
        try{
          // decode up to twice to handle double-encoding
          var d = decodeURIComponent(h);
          try{ d = decodeURIComponent(d); }catch(e){}
          d = d.replace(/%22/g,'').replace(/\"/g,'').replace(/^\s+|\s+$/g,'');
          // remove leading/trailing quotes
          d = d.replace(/^\"+|\"+$/g,'').replace(/^'+|'+$/g,'');
          return d;
        }catch(e){ return h; }
      }

      function processAll(){
        document.querySelectorAll('a[href]').forEach(function(a){
          var original = a.getAttribute('href');
          var cleaned = cleanHref(original);
          if(cleaned && cleaned !== original){
            a.setAttribute('href', cleaned);
          }
        });
      }

      // Intercept clicks where href still contains %22 or quotes
      document.addEventListener('click', function(e){
        var a = e.target.closest && e.target.closest('a[href]');
        if(!a) return;
        var href = a.getAttribute('href');
        if(!href) return;
        if(href.indexOf('%22') !== -1 || href.indexOf('"') !== -1 || href.indexOf("'") !== -1){
          e.preventDefault();
          var cleaned = cleanHref(href);
          if(cleaned){
            window.location.href = cleaned;
          }
        }
      }, true);

      // run on load and after DOM mutations
      document.addEventListener('DOMContentLoaded', processAll);
      // observe DOM changes to catch dynamic anchors
      try{
        var obs = new MutationObserver(function(){ processAll(); });
        obs.observe(document.body, { childList: true, subtree: true });
      }catch(e){}
    })();

    // Register the (new) service worker so clients get the updated assets
    (function registerServiceWorker(){
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/service-worker.js')
          .then(function(reg){ console.info('ServiceWorker registered', reg.scope); })
          .catch(function(err){ console.warn('SW register failed', err); });
      }
    })();
  </script>
</body>
</html>
